[program:yii2-kafka-worker]
command=php /var/www/app/yii worker/start
directory=/var/www/app
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=30
stopsignal=TERM
stdout_logfile=/var/log/yii2-kafka-worker.out.log
stderr_logfile=/var/log/yii2-kafka-worker.err.log
user=www-data
numprocs=1
process_name=%(program_name)s_%(process_num)02d
